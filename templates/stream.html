<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProctorAI – Live Monitoring</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: #0d0d0d;
        color: white;
        text-align: center;
        font-family: "Segoe UI", sans-serif;
    }

    .header {
        padding: 30px;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(90deg, #00a6ff, #007bff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .video-frame {
        margin-top: 20px;
        border: 4px solid #0d6efd;
        border-radius: 14px;
        box-shadow: 0 0 25px rgba(0, 128, 255, 0.3);
    }

    .info-box {
        margin-top: 20px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.05);
        display: inline-block;
        border-radius: 12px;
        color: #ccc;
        font-size: 1rem;
        box-shadow: 0 0 20px rgba(0, 119, 255, 0.2);
    }

    .btn-upload {
        margin-top: 25px;
        padding: 12px 30px;
        font-size: 1.1rem;
        border-radius: 10px;
        background: #0d6efd;
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn-upload:hover {
        background: #094db5;
        transform: scale(1.05);
    }
</style>

</head>
<body>

<div class="header">Real-Time Exam Monitoring</div>

<img src="{{ url_for('stream') }}" class="video-frame" width="950" height="520">

<div class="info-box">
    🔴 Red box = Suspicious behavior detected <br>
    🟢 Green box = Normal behavior
</div>

<br>

<a href="{{ url_for('home') }}" class="btn-upload">Upload Another Video</a>

</body>
</html>
