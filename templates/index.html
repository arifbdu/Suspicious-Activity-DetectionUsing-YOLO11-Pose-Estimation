<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Proctor-AI - Exam Monitoring</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="page"><h1>Proctor-AI - Exam Monitoring</h1><p class="subtitle">Upload your video to detect suspicious behavior in the exam hall in real time.</p>
<form action="{{ url_for('detect') }}" method="POST" enctype="multipart/form-data" id="upload-form"><input type="file" name="video" id="video" accept="video/*,.mkv,.avi" required aria-label="Choose a video to upload"><button type="submit" id="upload-btn">Upload &amp; Start Detection</button></form>
<p id="status" class="status" role="status" aria-live="polite" hidden></p><progress id="progress" max="100" value="0" hidden></progress><p id="error" class="error" role="alert" hidden></p>
<section class="preview" aria-label="Exam detection video"><div class="viewbox" id="viewbox"><div class="empty" id="placeholder"><div class="camera">▣</div><span>Upload an exam video to preview detection results</span></div><img id="live-preview" alt="Live annotated detection stream" hidden><video id="result-video" controls playsinline preload="metadata" hidden></video></div><p class="summary" id="summary" hidden></p><a class="download" id="download" hidden>Download Annotated Video</a></section><p class="footnote">AI-generated flags indicate potential concerns, not proof of misconduct. Human review is required.</p></main>
<script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
